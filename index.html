<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi Eli ✨</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #020208; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    /* Pantalla de Intro */
    #intro-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, #150a21 0%, #020208 100%); color: #fff;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 10; cursor: pointer; transition: opacity 1.5s ease;
    }
    #intro-text { 
      font-size: 30px; text-align: center; max-width: 85%; 
      margin-bottom: 20px; transition: opacity 0.5s ease; font-weight: 600;
      text-shadow: 0 0 15px rgba(244, 114, 182, 0.6);
    }
    #click-hint { font-size: 15px; color: #f472b6; animation: pulse 2s infinite; letter-spacing: 1px; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    
    /* Controles 3D */
    #info {
      position: absolute; bottom: 25px; width: 100%; text-align: center;
      color: rgba(255,255,255,0.7); pointer-events: none; font-size: 14px; z-index: 1; opacity: 0; transition: opacity 2s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <audio id="bgMusic" loop preload="auto">
    <source src="those_years_are_over.mp3" type="audio/mpeg">
  </audio>

  <!-- Pantalla de Introducción -->
  <div id="intro-screen">
    <div id="intro-text">Para empezar...</div>
    <div id="click-hint">(Toca la pantalla en cualquier parte)</div>
  </div>

  <div id="info">Desliza para mover la cámara y explorar el universo de mensajes ✨</div>

  <script>
    // --- 1. LÓGICA DE INTRODUCCIÓN Y MÚSICA ---
    const introTexts = [
      "Para mi Eli ❤️",
      "Por ser mi niña hemocha mi foquita lelonda",
      "Tu Noe te hizo esto amor... bueno yo no jkasda",
      "Lista pala tu legalo :0"
    ];
    let clickCount = 0;
    
    const introScreen = document.getElementById('intro-screen');
    const textElement = document.getElementById('intro-text');
    const infoElement = document.getElementById('info');
    const bgMusic = document.getElementById('bgMusic');

    introScreen.addEventListener('click', () => {
      if (clickCount === 0) {
        bgMusic.volume = 0.2; 
        bgMusic.play().catch(e => console.log("Error de audio:", e));
        document.getElementById('click-hint').innerText = "(Toca para continuar)";
      }

      if (clickCount < introTexts.length) {
        textElement.style.opacity = 0;
        setTimeout(() => {
          textElement.innerText = introTexts[clickCount];
          textElement.style.opacity = 1;
          clickCount++;
        }, 300);
      } else {
        introScreen.style.opacity = 0;
        setTimeout(() => { introScreen.style.display = 'none'; }, 1500);
        infoElement.style.opacity = 1;
        
        let volInterval = setInterval(() => {
          if (bgMusic.volume < 0.6) {
            bgMusic.volume = Math.min(bgMusic.volume + 0.05, 0.6);
          } else {
            clearInterval(volInterval);
          }
        }, 300);
      }
    });

    // --- 2. CONFIGURACIÓN 3D ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020208, 0.008);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 24);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true; 
    controls.autoRotateSpeed = 0.35; 

    // --- 3. ILUMINACIÓN ESPACIAL ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    
    const pinkLight = new THREE.PointLight(0xff66b2, 3, 70);
    pinkLight.position.set(0, 5, 0);
    scene.add(pinkLight);

    const blueLight = new THREE.PointLight(0x77bbff, 2, 60);
    blueLight.position.set(-20, -10, 20);
    scene.add(blueLight);

    // --- 4. CIELO ESTRELLADO (GALAXIA) ---
    const starCount = 1200;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount * 3; i += 3) {
      starPos[i] = (Math.random() - 0.5) * 100;
      starPos[i+1] = (Math.random() - 0.5) * 100;
      starPos[i+2] = (Math.random() - 0.5) * 100;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));

    const canvasS = document.createElement('canvas');
    canvasS.width = 64; canvasS.height = 64;
    const ctxS = canvasS.getContext('2d');
    const gradS = ctxS.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradS.addColorStop(0, 'rgba(255, 255, 255, 1)');
    gradS.addColorStop(0.4, 'rgba(244, 114, 182, 0.7)');
    gradS.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctxS.fillStyle = gradS;
    ctxS.fillRect(0, 0, 64, 64);
    
    const starTexture = new THREE.CanvasTexture(canvasS);
    const starMat = new THREE.PointsMaterial({
      size: 0.9,
      map: starTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    // --- 5. CORAZÓN 3D ROSA EN EL CENTRO ---
    function createHeartMesh() {
      const x = 0, y = 0;
      const heartShape = new THREE.Shape();
      heartShape.moveTo(x + 5, y + 5);
      heartShape.bezierCurveTo(x + 5, y + 5, x + 4, y, x, y);
      heartShape.bezierCurveTo(x - 6, y, x - 6, y + 7, x - 6, y + 7);
      heartShape.bezierCurveTo(x - 6, y + 11, x - 3, y + 15.4, x + 5, y + 19);
      heartShape.bezierCurveTo(x + 13, y + 15.4, x + 16, y + 11, x + 16, y + 7);
      heartShape.bezierCurveTo(x + 16, y + 7, x + 16, y, x + 10, y);
      heartShape.bezierCurveTo(x + 7, y, x + 5, y + 5, x + 5, y + 5);

      const extrudeSettings = {
        depth: 4,
        bevelEnabled: true,
        bevelSegments: 5,
        steps: 2,
        bevelSize: 1.5,
        bevelThickness: 1.5
      };

      const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
      geometry.center(); // Centrar el corazón

      const material = new THREE.MeshStandardMaterial({
        color: 0xff4797,
        emissive: 0xaa1155,
        roughness: 0.2,
        metalness: 0.4
      });

      const heartMesh = new THREE.Mesh(geometry, material);
      heartMesh.scale.set(0.18, 0.18, 0.18); // Ajustar tamaño ideal
      heartMesh.rotation.math = Math.PI; // Orientarlo bien
      return heartMesh;
    }

    const centralHeart = createHeartMesh();
    centralHeart.position.set(0, 0, 0);
    scene.add(centralHeart);

    // --- 6. TEXTOS FLOTANTES CON TUS FRASES ---
    function createGlowText(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 2048; 
      canvas.height = 256;

      ctx.clearRect(0, 0, canvas.width, canvas.height); 
      
      ctx.font = 'bold 52px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Sombra y brillo rosado/dorado estético
      ctx.shadowColor = '#f472b6';
      ctx.shadowBlur = 22;

      ctx.lineWidth = 10;
      ctx.strokeStyle = 'rgba(5, 2, 15, 0.95)';
      ctx.strokeText(text, canvas.width / 2, canvas.height / 2);

      ctx.fillStyle = '#fff0f5'; 
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(21, 2.6, 1); 
      return sprite;
    }

    const frases = [
      "Para mi Eli, la dueña de todo mi corazón ❤️",
      "Mi gordita hermosa, mi bebé 🥺",
      "Mi foquita lelonda, la más tierna del universo 🦭",
      "Tú y yo contra el mundo, mi plo 💕",
      "La sonrisa de mi niña ilumina toda mi vida ✨",
      "Mi bebé, mi mundo, mi todo 💖",
      "Mi persona favorita en todo el planeta 💛",
      "Gordita mía, eres perfecta tal y como eres y te amo así 🥰",
      "Me encantan tus cachetitos, cuando sonríes se marcan más y me dan mucha ternura 🥺",
      "Eres tan linda cuando sonríes y se te marcan tus cachetitos 🫠",
      "Tienes unos ojitos hermosos que me encantan mirarle ✨",
      "Tus ojitos brillan tan bonito cuando estás feliz 🌌",
      "Cada vez que te sonríes y se marcan tus cachetes, me derrito de amor 😍",
      "Me da muchísima ternura cada gesto que haces 🥺",
      "Nadie tiene una sonrisa más hermosa y tierna que la tuya 🌸",
      "Me encanta hacerte sentir bien y verte sonreír siempre 💛",
      "Aquí manda mi Eli y se hace lo que ella diga 👑",
      "Lo que mi niña quiera, se hace y punto 😌",
      "Mi Eli preciosa, la que manda en esta relación 👸",
      "Te amo muchísimo, eres la más hermosa de todas 💕",
      "Soy el chico más afortunado por tenerte a mi lado 💍",
      "Me tienes enamorado por completo 🤤",
      "Eres la Hokage de mi corazón 🍃",
      "Nuestro amor es más fuerte que cualquier técnica de Naruto 🌀",
      "Tú eres mi camino ninja favorito ✨",
      "Dattebayo! Eres lo mejor que me ha pasado 🍜",
      "Siempre te cuidaré y estaré para ti, mi amor 🤞",
      "Eres la dueña de la Aldea de la Hoja y de mi vida 🍃",
      "Mi niña hermosa, la kunoichi más linda de todas 🌸",
      "Contigo quiero vivir todas las aventuras de nuestra historia 🍥",
      "Mi amor por ti es inmenso y sincero 💛",
      "Juntos superaremos cualquier cosa que se presente 📜",
      "Esperaremos estos años juntos, te lo prometo ⏳",
      "Valdrá la pena cada segundo esperando y construyendo nuestro futuro 🥰",
      "No importa el tiempo, siempre quiero estar contigo 🕰️",
      "El futuro es hermoso si es a tu lado, mi niña 🌅",
      "Cuento los días para estar siempre juntos 🗓️",
      "La paciencia es fácil cuando la recompensa eres tú ❤️",
      "Superaremos todo juntos, mi amor 🚀",
      "Prometo amarte y cuidarte todos los años de nuestra vida ♾️",
      "Cada día que pasa te amo un poquito más 📈",
      "Valió la pena encontrarte y valdrá la pena cada año a tu lado 🛡️"
    ];

    const sprites = [];
    frases.forEach((text) => {
      const sprite = createGlowText(text);
      
      // Distribuir en esfera alrededor del corazón central (evitando que caigan justo en el centro 0,0,0)
      let u = Math.random();
      let v = Math.random();
      let theta = u * 2.0 * Math.PI;
      let phi = Math.acos(2.0 * v - 1.0);
      let r = 10 + Math.random() * 20; // Radio de distancia del centro

      sprite.position.set(
        r * Math.sin(phi) * Math.cos(theta),
        (Math.random() - 0.5) * 16,
        r * Math.sin(phi) * Math.sin(theta)
      );

      scene.add(sprite);
      sprites.push({ mesh: sprite, offset: Math.random() * 100 });
    });

    // --- 7. BUCLE DE ANIMACIÓN ---
    function animate() {
      requestAnimationFrame(animate);
      
      const time = Date.now() * 0.0006;
      
      // Latido suave del corazón central y rotación
      const heartbeat = 1 + Math.sin(time * 4) * 0.06;
      centralHeart.scale.set(0.18 * heartbeat, 0.18 * heartbeat, 0.18 * heartbeat);
      centralHeart.rotation.y += 0.005;

      // Animar estrellas del espacio
      const positions = starField.geometry.attributes.position.array;
      for(let i = 1; i < positions.length; i += 3) {
        positions[i] -= 0.015;
        if(positions[i] < -50) positions[i] = 50;
      }
      starField.geometry.attributes.position.needsUpdate = true;

      // Flotar textos suavemente
      sprites.forEach(s => {
        s.mesh.position.y += Math.sin(time * 2 + s.offset) * 0.004;
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
