<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi Eli 🌻</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #030308; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    /* Pantalla de Intro */
    #intro-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, #100b24 0%, #030308 100%); color: #fff;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 10; cursor: pointer; transition: opacity 1.5s ease;
    }
    #intro-text { 
      font-size: 30px; text-align: center; max-width: 85%; 
      margin-bottom: 20px; transition: opacity 0.5s ease; font-weight: 600;
      text-shadow: 0 0 15px rgba(253, 224, 71, 0.5);
    }
    #click-hint { font-size: 15px; color: #fde047; animation: pulse 2s infinite; letter-spacing: 1px; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    
    /* Controles 3D */
    #info {
      position: absolute; bottom: 25px; width: 100%; text-align: center;
      color: rgba(255,255,255,0.7); pointer-events: none; font-size: 14px; z-index: 1; opacity: 0; transition: opacity 2s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <audio id="bgMusic" loop preload="auto">
    <source src="those_years_are_over.mp3" type="audio/mpeg">
  </audio>

  <!-- Pantalla de Introducción -->
  <div id="intro-screen">
    <div id="intro-text">Para empezar...</div>
    <div id="click-hint">(Toca la pantalla en cualquier parte)</div>
  </div>

  <div id="info">Desliza para mover la cámara y explorar el universo de mensajes 🌻</div>

  <script>
    // --- 1. LÓGICA DE INTRODUCCIÓN Y MÚSICA ---
    const introTexts = [
      "Para mi Eli ❤️",
      "Por ser mi niña hemocha mi foquita lelonda",
      "Tu Noe te hizo esto amor... bueno yo no jkasda",
      "Lista pala tu legalo :0"
    ];
    let clickCount = 0;
    
    const introScreen = document.getElementById('intro-screen');
    const textElement = document.getElementById('intro-text');
    const infoElement = document.getElementById('info');
    const bgMusic = document.getElementById('bgMusic');

    introScreen.addEventListener('click', () => {
      if (clickCount === 0) {
        bgMusic.volume = 0.2; 
        bgMusic.play().catch(e => console.log("Error de audio:", e));
        document.getElementById('click-hint').innerText = "(Toca para continuar)";
      }

      if (clickCount < introTexts.length) {
        textElement.style.opacity = 0;
        setTimeout(() => {
          textElement.innerText = introTexts[clickCount];
          textElement.style.opacity = 1;
          clickCount++;
        }, 300);
      } else {
        introScreen.style.opacity = 0;
        setTimeout(() => { introScreen.style.display = 'none'; }, 1500);
        infoElement.style.opacity = 1;
        
        let volInterval = setInterval(() => {
          if (bgMusic.volume < 0.6) {
            bgMusic.volume = Math.min(bgMusic.volume + 0.05, 0.6);
          } else {
            clearInterval(volInterval);
          }
        }, 300);
      }
    });

    // --- 2. CONFIGURACIÓN 3D ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030308, 0.010);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true; 
    controls.autoRotateSpeed = 0.35; 

    // --- 3. ILUMINACIÓN CINEMÁTICA Y BRILLANTE ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    
    const sunLight = new THREE.PointLight(0xffea75, 3, 60);
    sunLight.position.set(0, 10, 0);
    scene.add(sunLight);

    const pinkLight = new THREE.PointLight(0xff77aa, 2, 50);
    pinkLight.position.set(-15, -10, 15);
    scene.add(pinkLight);

    const blueLight = new THREE.PointLight(0x77bbff, 2, 50);
    blueLight.position.set(15, -10, -15);
    scene.add(blueLight);

    // --- 4. POLVO ESTELAR Y BRILLOS MÁGICOS ---
    const particleCount = 700;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      particlePos[i] = (Math.random() - 0.5) * 70;
      particlePos[i+1] = (Math.random() - 0.5) * 40;
      particlePos[i+2] = (Math.random() - 0.5) * 70;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));

    // Crear textura brillante para las partículas
    const canvasP = document.createElement('canvas');
    canvasP.width = 64; canvasP.height = 64;
    const ctxP = canvasP.getContext('2d');
    const gradP = ctxP.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradP.addColorStop(0, 'rgba(255, 255, 200, 1)');
    gradP.addColorStop(0.3, 'rgba(253, 224, 71, 0.8)');
    gradP.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctxP.fillStyle = gradP;
    ctxP.fillRect(0, 0, 64, 64);
    
    const particleTexture = new THREE.CanvasTexture(canvasP);
    const particleMat = new THREE.PointsMaterial({
      size: 0.8,
      map: particleTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const starDust = new THREE.Points(particleGeo, particleMat);
    scene.add(starDust);

    // --- 5. CREACIÓN DE FLORES DETALLADAS Y TEXTURIZADAS ---
    function createDetailedFlower() {
      const flowerGroup = new THREE.Group();

      // Centro de la flor detallado (textura de girasol)
      const centerGeo = new THREE.SphereGeometry(0.35, 24, 24);
      const centerMat = new THREE.MeshStandardMaterial({ 
        color: 0x3d2314, 
        roughness: 0.9,
        metalness: 0.1
      });
      const centerMesh = new THREE.Mesh(centerGeo, centerMat);
      flowerGroup.add(centerMesh);

      // Pétalos con volumen y forma curva elegante
      const petalGeo = new THREE.BoxGeometry(0.22, 1.4, 0.05);
      const petalMat = new THREE.MeshStandardMaterial({ 
        color: 0xffd700, 
        emissive: 0x332200,
        roughness: 0.3,
        metalness: 0.2
      });

      const petalCount = 16;
      for (let i = 0; i < petalCount; i++) {
        const petal = new THREE.Mesh(petalGeo, petalMat);
        const angle = (i / petalCount) * Math.PI * 2;
        
        petal.position.set(Math.cos(angle) * 0.6, Math.sin(angle) * 0.6, 0);
        petal.rotation.z = angle - Math.PI / 2;
        petal.rotation.x = 0.2; // Inclinación natural hacia afuera
        
        flowerGroup.add(petal);
      }
      return flowerGroup;
    }

    const flowers = [];
    for (let i = 0; i < 65; i++) {
      const flower = createDetailedFlower();
      flower.position.set(
        (Math.random() - 0.5) * 55,
        (Math.random() - 0.5) * 22,
        (Math.random() - 0.5) * 55
      );
      flower.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      
      const scale = 0.7 + Math.random() * 0.6;
      flower.scale.set(scale, scale, scale);

      scene.add(flower);
      flowers.push({ mesh: flower, rotSpeedX: (Math.random() - 0.5) * 0.01, rotSpeedY: (Math.random() - 0.5) * 0.01 });
    }

    // --- 6. TEXTOS FLOTANTES BRILLANTES ---
    function createGlowText(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 2048; 
      canvas.height = 256;

      ctx.clearRect(0, 0, canvas.width, canvas.height); 
      
      ctx.font = 'bold 52px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Sombra exterior con brillo dorado luminoso
      ctx.shadowColor = '#fde047';
      ctx.shadowBlur = 20;

      ctx.lineWidth = 10;
      ctx.strokeStyle = 'rgba(5, 5, 15, 0.95)';
      ctx.strokeText(text, canvas.width / 2, canvas.height / 2);

      ctx.fillStyle = '#fffae6'; 
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(21, 2.6, 1); 
      return sprite;
    }

    const frases = [
      "Para mi Eli, la dueña de todo mi corazón ❤️",
      "Mi gordita hermosa, mi bebé 🥺",
      "Mi foquita lelonda, la más tierna del universo 🦭",
      "Tú y yo contra el mundo, mi plo 💕",
      "La sonrisa de mi niña ilumina toda mi vida 🌻",
      "Mi bebé, mi mundo, mi todo 💖",
      "Mi persona favorita en todo el planeta 💛",
      "Gordita mía, eres perfecta tal y como eres y te amo así 🥰",
      "Me encantan tus cachetitos, cuando sonríes se marcan más y me dan mucha ternura 🥺",
      "Eres tan linda cuando sonríes y se te marcan tus cachetitos 🫠",
      "Tienes unos ojitos hermosos que me encantan mirarle ✨",
      "Tus ojitos brillan tan bonito cuando estás feliz 🌌",
      "Cada vez que te sonríes y se marcan tus cachetes, me derrito de amor 😍",
      "Me da muchísima ternura cada gesto que haces 🥺",
      "Nadie tiene una sonrisa más hermosa y tierna que la tuya 🌻",
      "Me encanta hacerte sentir bien y verte sonreír siempre 💛",
      "Aquí manda mi Eli y se hace lo que ella diga 👑",
      "Lo que mi niña quiera, se hace y punto 😌",
      "Mi Eli preciosa, la que manda en esta relación 👸",
      "Te amo muchísimo, eres la más hermosa de todas 💕",
      "Soy el chico más afortunado por tenerte a mi lado 💍",
      "Me tienes enamorado por completo 🤤",
      "Eres la Hokage de mi corazón 🍃",
      "Nuestro amor es más fuerte que cualquier técnica de Naruto 🌀",
      "Tú eres mi camino ninja favorito ✨",
      "Dattebayo! Eres lo mejor que me ha pasado 🍜",
      "Siempre te cuidaré y estaré para ti, mi amor 🤞",
      "Eres la dueña de la Aldea de la Hoja y de mi vida 🍃",
      "Mi niña hermosa, la kunoichi más linda de todas 🌸",
      "Contigo quiero vivir todas las aventuras de nuestra historia 🍥",
      "Mi amor por ti es inmenso y sincero 💛",
      "Juntos superaremos cualquier cosa que se presente 📜",
      "Esperaremos estos años juntos, te lo prometo ⏳",
      "Valdrá la pena cada segundo esperando y construyendo nuestro futuro 🥰",
      "No importa el tiempo, siempre quiero estar contigo 🕰️",
      "El futuro es hermoso si es a tu lado, mi niña 🌅",
      "Cuento los días para estar siempre juntos 🗓️",
      "La paciencia es fácil cuando la recompensa eres tú ❤️",
      "Superaremos todo juntos, mi amor 🚀",
      "Prometo amarte y cuidarte todos los años de nuestra vida ♾️",
      "Cada día que pasa te amo un poquito más 📈",
      "Valió la pena encontrarte y valdrá la pena cada año a tu lado 🛡️"
    ];

    const sprites = [];
    frases.forEach((text) => {
      const sprite = createGlowText(text);
      sprite.position.set(
        (Math.random() - 0.5) * 48,
        (Math.random() - 0.5) * 18 + 2,
        (Math.random() - 0.5) * 48
      );
      scene.add(sprite);
      sprites.push({ mesh: sprite, offset: Math.random() * 100 });
    });

    // --- 7. BUCLE DE ANIMACIÓN FLUIDA ---
    function animate() {
      requestAnimationFrame(animate);
      
      const time = Date.now() * 0.0006;
      
      // Rotar y flotar flores
      flowers.forEach((f, index) => {
        f.mesh.rotation.x += f.rotSpeedX;
        f.mesh.rotation.y += f.rotSpeedY;
        f.mesh.position.y += Math.sin(time + index) * 0.008;
      });

      // Animar partículas de polvo estelar
      const positions = starDust.geometry.attributes.position.array;
      for(let i = 1; i < positions.length; i += 3) {
        positions[i] -= 0.02; // Caen lentamente
        if(positions[i] < -20) positions[i] = 20; // Reinician arriba
      }
      starDust.geometry.attributes.position.needsUpdate = true;

      // Flotar textos suavemente
      sprites.forEach(s => {
        s.mesh.position.y += Math.sin(time * 2 + s.offset) * 0.004;
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
