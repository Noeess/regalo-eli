<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi Eli 🌻</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #050510; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    /* Pantalla de Intro */
    #intro-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #050510; color: #fff;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 10; cursor: pointer; transition: opacity 1.5s ease;
    }
    #intro-text { 
      font-size: 28px; text-align: center; max-width: 85%; 
      margin-bottom: 20px; transition: opacity 0.5s ease; font-weight: bold;
    }
    #click-hint { font-size: 14px; color: #888; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    
    /* Controles 3D */
    #info {
      position: absolute; bottom: 20px; width: 100%; text-align: center;
      color: rgba(255,255,255,0.6); pointer-events: none; font-size: 14px; z-index: 1; opacity: 0; transition: opacity 2s ease;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Audio corregido para que cargue y suene bien -->
  <audio id="bgMusic" loop preload="auto">
    <source src="those_years_are_over.mp3" type="audio/mpeg">
  </audio>

  <!-- Pantalla de Introducción -->
  <div id="intro-screen">
    <div id="intro-text">Para empezar...</div>
    <div id="click-hint">(Toca la pantalla en cualquier parte)</div>
  </div>

  <div id="info">Desliza para mover la cámara y ver todo con amor 🌻</div>

  <script>
    // --- 1. LÓGICA DE LA INTRODUCCIÓN Y MÚSICA ---
    const introTexts = [
      "Para mi Eli ❤️",
      "Por ser mi niña hemocha mi foquita lelonda",
      "Tu Noe te hizo esto amor... bueno yo no jkasda",
      "Lista pala tu legalo :0"
    ];
    let clickCount = 0;
    
    const introScreen = document.getElementById('intro-screen');
    const textElement = document.getElementById('intro-text');
    const infoElement = document.getElementById('info');
    const bgMusic = document.getElementById('bgMusic');

    introScreen.addEventListener('click', () => {
      // Primer clic: Inicia música bajita
      if (clickCount === 0) {
        bgMusic.volume = 0.2; 
        bgMusic.play().catch(e => console.log("Error de audio:", e));
        document.getElementById('click-hint').innerText = "(Toca para continuar)";
      }

      if (clickCount < introTexts.length) {
        textElement.style.opacity = 0;
        setTimeout(() => {
          textElement.innerText = introTexts[clickCount];
          textElement.style.opacity = 1;
          clickCount++;
        }, 300);
      } else {
        // Último clic: Abrir 3D y subir volumen
        introScreen.style.opacity = 0;
        setTimeout(() => { introScreen.style.display = 'none'; }, 1500);
        infoElement.style.opacity = 1;
        
        let volInterval = setInterval(() => {
          if (bgMusic.volume < 0.6) {
            bgMusic.volume = Math.min(bgMusic.volume + 0.05, 0.6);
          } else {
            clearInterval(volInterval);
          }
        }, 300);
      }
    });

    // --- 2. CONFIGURACIÓN 3D ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050510, 0.012);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true; 
    controls.autoRotateSpeed = 0.4; 

    // Iluminación
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const pointLight = new THREE.PointLight(0xffdd00, 2, 50);
    scene.add(pointLight);

    // --- 3. CREACIÓN DE FLORES ---
    function createFlower() {
      const flowerGroup = new THREE.Group();
      const centerGeo = new THREE.SphereGeometry(0.3, 16, 16);
      const centerMat = new THREE.MeshBasicMaterial({ color: 0x4a2e1b });
      flowerGroup.add(new THREE.Mesh(centerGeo, centerMat));

      const petalGeo = new THREE.ConeGeometry(0.2, 1.2, 8);
      const petalMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2 });

      for (let i = 0; i < 12; i++) {
        const petal = new THREE.Mesh(petalGeo, petalMat);
        const angle = (i / 12) * Math.PI * 2;
        petal.position.set(Math.cos(angle) * 0.7, Math.sin(angle) * 0.7, 0);
        petal.rotation.z = angle - Math.PI / 2;
        petal.rotation.x = Math.PI / 2;
        flowerGroup.add(petal);
      }
      return flowerGroup;
    }

    const flowers = [];
    for (let i = 0; i < 80; i++) {
      const flower = createFlower();
      flower.position.set(
        (Math.random() - 0.5) * 60,
        (Math.random() - 0.5) * 25,
        (Math.random() - 0.5) * 60
      );
      flower.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      scene.add(flower);
      flowers.push(flower);
    }

    // --- 4. TEXTOS FLOTANTES (100% PERSONALIZADOS CON TUS DATOS) ---
    function createMinimalistText(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 2048; 
      canvas.height = 256;

      ctx.clearRect(0, 0, canvas.width, canvas.height); 
      
      ctx.font = 'bold 50px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.lineWidth = 8;
      ctx.strokeStyle = 'rgba(10, 10, 20, 0.9)';
      ctx.strokeText(text, canvas.width / 2, canvas.height / 2);

      ctx.fillStyle = '#fde047'; 
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(20, 2.5, 1); 
      return sprite;
    }

    const frases = [
      // Sobre Eli y apodos cariñosos
      "Para mi Eli, la dueña de todo mi corazón ❤️",
      "Mi gordita hermosa, mi bebé 🥺",
      "Mi foquita lelonda, la más tierna del universo 🦭",
      "Tú y yo contra el mundo, mi plo 💕",
      "La sonrisa de mi niña ilumina toda mi vida 🌻",
      "Mi bebé, mi mundo, mi todo 💖",
      "Mi persona favorita en todo el planeta 💛",
      "Gordita mía, eres perfecta tal y como eres y te amo así 🥰",
      
      // Cachetitos, ojitos y ternura (100% tuyos)
      "Me encantan tus cachetitos, cuando sonríes se marcan más y me dan mucha ternura 🥺",
      "Eres tan linda cuando sonríes y se te marcan tus cachetitos 🫠",
      "Tienes unos ojitos hermosos que me encantan mirarle ✨",
      "Tus ojitos brillan tan bonito cuando estás feliz 🌌",
      "Cada vez que te sonríes y se marcan tus cachetes, me derrito de amor 😍",
      "Me da muchísima ternura cada gesto que haces 🥺",
      "Nadie tiene una sonrisa más hermosa y tierna que la tuya 🌻",
      "Me encanta hacerte sentir bien y verte sonreír siempre 💛",

      // Dinámica de la relación (Ella manda)
      "Aquí manda mi Eli y se hace lo que ella diga 👑",
      "Lo que mi niña quiera, se hace y punto 😌",
      "Mi Eli preciosa, la que manda en esta relación 👸",
      "Te amo muchísimo, eres la más hermosa de todas 💕",
      "Soy el chico más afortunado por tenerte a mi lado 💍",
      "Me tienes enamorado por completo 🤤",
      
      // Naruto (Otaku)
      "Eres la Hokage de mi corazón 🍃",
      "Nuestro amor es más fuerte que cualquier técnica de Naruto 🌀",
      "Tú eres mi camino ninja favorito ✨",
      "Dattebayo! Eres lo mejor que me ha pasado 🍜",
      "Siempre te cuidaré y estaré para ti, mi amor 🤞",
      "Eres la dueña de la Aldea de la Hoja y de mi vida 🍃",
      "Mi niña hermosa, la kunoichi más linda de todas 🌸",
      "Contigo quiero vivir todas las aventuras de nuestra historia 🍥",
      "Mi amor por ti es inmenso y sincero 💛",
      "Juntos superaremos cualquier cosa que se presente 📜",
      
      // Futuro y años juntos
      "Esperaremos estos años juntos, te lo prometo ⏳",
      "Valdrá la pena cada segundo esperando y construyendo nuestro futuro 🥰",
      "No importa el tiempo, siempre quiero estar contigo 🕰️",
      "El futuro es hermoso si es a tu lado, mi niña 🌅",
      "Cuento los días para estar siempre juntos 🗓️",
      "La paciencia es fácil cuando la recompensa eres tú ❤️",
      "Superaremos todo juntos, mi amor 🚀",
      "Prometo amarte y cuidarte todos los años de nuestra vida ♾️",
      "Cada día que pasa te amo un poquito más 📈",
      "Valió la pena encontrarte y valdrá la pena cada año a tu lado 🛡️"
    ];

    const sprites = [];
    frases.forEach((text) => {
      const sprite = createMinimalistText(text);
      sprite.position.set(
        (Math.random() - 0.5) * 50,
        (Math.random() - 0.5) * 20 + 2,
        (Math.random() - 0.5) * 50
      );
      scene.add(sprite);
      sprites.push({ mesh: sprite, offset: Math.random() * 100 });
    });

    // --- 5. BUCLE DE ANIMACIÓN ---
    function animate() {
      requestAnimationFrame(animate);
      
      const time = Date.now() * 0.0005;
      
      flowers.forEach((f, index) => {
        f.rotation.y += 0.005;
        f.rotation.z += 0.002;
        f.position.y += Math.sin(time + index) * 0.01;
      });

      sprites.forEach(s => {
        s.mesh.position.y += Math.sin(time * 2 + s.offset) * 0.005;
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
